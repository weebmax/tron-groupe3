<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <title>Tron Multiplayer</title>
</head>
<body>
    <!-- Écran d'enregistrement -->
    <div id="registration-screen" class="screen active">
        <div class="container">
            <h1> Tron Multiplayer</h1>
            <p class="subtitle">Entrez vos informations pour rejoindre la partie</p>
            
            <div class="form-group">
                <label for="player-name">Nom du joueur</label>
                <input type="text" id="player-name" placeholder="Votre pseudo" maxlength="15">
            </div>
            
            <div class="form-group">
                <label for="player-color">Couleur</label>
                <select id="player-color">
                    <option value="#4F46E5">🔵 Bleu </option>
                    <option value="#EF4444">🔴 Rouge</option>
                    <option value="#10B981">🟢 Vert</option>
                    <option value="#F59E0B">🟠 Orange</option>
                </select>
            </div>
            
            <button id="join-btn" class="btn-primary">Rejoindre la partie</button>
            
            <div id="connection-status" class="status disconnected">
                ● Connexion au serveur...
            </div>
        </div>
    </div>

    <!-- Écran de jeu -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="player-info">
                <span id="current-player-name">Joueur</span>
                <span id="current-player-color" class="color-badge"></span>
            </div>
            <button id="disconnect-btn" class="btn-secondary">Se déconnecter</button>
        </div>

        <div class="game-content">
            <!-- Liste des joueurs connectés -->
            <div class="players-panel">
                <h3>🎮 Joueurs connectés (<span id="player-count">0</span>)</h3>
                <ul id="players-list"></ul>
            </div>

            <!-- Zone de messages/chat -->
            <div class="messages-panel">
                <h3>💬 Messages</h3>
                <div id="messages-container"></div>
                
                <div class="message-input-group">
                    <input type="text" id="message-input" placeholder="Tapez un message...">
                    <button id="send-btn" class="btn-send">Envoyer</button>
                </div>
            </div>
        </div>

        <!-- Zone de jeu (prête pour le canvas) -->
        <div class="canvas-container">
            <p class="placeholder"> Zone de jeu - En attente...</p>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
